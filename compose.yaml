services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: timezone-bot:local
    container_name: timezone-bot
    platform: linux/arm64
    restart: unless-stopped
    init: true
    env_file:
      - ${TIMEZONE_ENV_FILE:-/etc/timezone-bot/env}
    environment:
      NODE_ENV: production
      TIMEZONE_DATA_FILE: /var/lib/timezone/timezones.json
    volumes:
      - ${TIMEZONE_DATA_DIR:-/var/lib/timezone}:/var/lib/timezone
